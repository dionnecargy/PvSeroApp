name: Deploy PvSeroApp to shinyapps.io

on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to ShinyApps.io

    if: "!contains(github.event.head_commit.message, '[automated]') && !contains(github.event.head_commit.message, '[no-deploy]')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      # 1. Install system libraries required for {systemfonts}, {textshaping}, {gdtools}, {magick}, {nloptr}
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libcairo2-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfontconfig1-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libmagick++-dev \
            libicu-dev \
            libnlopt-dev \
            pkg-config \
            build-essential

      # 2. Setup R
      - uses: r-lib/actions/setup-r@v2

      # 3. Cache packages so you *don't* wait 45 min every time
      - uses: actions/cache@v3
        with:
          path: ~/.cache/R
          key: ${{ runner.os }}-R-${{ hashFiles('**/renv.lock') }}
          restore-keys: ${{ runner.os }}-R-

      # 4. Restore R package library via renv
      - name: Restore renv packages (using Posit binaries)
        run: |
          Rscript -e 'install.packages("renv")'
          Rscript -e 'options(renv.download.method = "curl", renv.config.install.staged = FALSE, repos = c(CRAN="https://packagemanager.posit.co/cran/__linux__/jammy/latest")); renv::restore(prompt = FALSE)'

      # 5. Deploy
      - name: Deploy to shinyapps.io
        uses: BDSI-Utwente/shinyapps-deploy-github-action@v1
        with:
          appName: 'PvSeroApp'       # your shinyapps.io app name
          accountName: 'dionnecargy' # your shinyapps.io username
          accountToken: ${{ secrets.TOKEN }}
          accountSecret: ${{ secrets.SECRET }}
