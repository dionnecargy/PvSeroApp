name: Deploy Shiny App to shinyapps.io

# Trigger deployment on push to main branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to shinyapps.io
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup R
      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      # 3️⃣ Install required R packages
      - name: Install R packages
        run: |
          install.packages(c(
            "shiny",
            "dplyr",
            "ggplot2",
            "tidyr",
            "readr"
          ))

      # 4️⃣ Deploy to ShinyApps.io
      - name: Deploy to ShinyApps.io
        uses: rstudio/shinyapps-deploy@v1
        with:
          shinyapps_username: ${{ secrets.SHINY_USERNAME }}
          shinyapps_token: ${{ secrets.TOKEN }}
          shinyapps_secret: ${{ secrets.SECRET }}
          app_name: 'PvSeroApp'
          app_dir: ''  # or folder name if ui.R/server.R are in a subfolder
      
