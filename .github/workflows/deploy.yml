name: Deploy PvSeroApp to shinyapps.io

on:
  # Run on any push
  push:
  # Also allow manual trigger in Actions tab
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to ShinyApps.io

    # Skip deployment if commit message contains '[automated]' or '[no-deploy]'
    if: "!contains(github.event.head_commit.message, '[automated]') && !contains(github.event.head_commit.message, '[no-deploy]')"
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - uses: actions/checkout@v2
      
      # 2. Install system dependencies needed by some R packages
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gfortran \
            libgfortran5 \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev
            
      # 3. Setup R
      - uses: r-lib/actions/setup-r@v2

      # 4. Restore R packages via renv
      - name: Restore renv packages
        run: R -e "renv::restore(prompt = FALSE)"
        
      # 3. Deploy to ShinyApps.io
      - name: Deploy
        uses: BDSI-Utwente/shinyapps-deploy-github-action@v1
        with:
          # Your app URL will be: https://<accountName>.shinyapps.io/<appName>/
          appName: 'PvSeroApp'             # your app name
          accountName: 'dionnecargy'       # your shinyapps.io username

          # GitHub secrets for authentication
          accountToken: ${{ secrets.TOKEN }}
          accountSecret: ${{ secrets.SECRET }}
