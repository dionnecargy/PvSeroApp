name: Deploy Shiny App to shinyapps.io

# Trigger deployment on push to main branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to shinyapps.io
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup R
      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      # 3️⃣ Install required R packages
      - name: Install R packages
        run: |
          install.packages(c(
            "shiny",
            "dplyr",
            "ggplot2",
            "tidyr",
            "readr"
          ))

      # 4️⃣ Deploy to ShinyApps.io
      - name: Deploy to shinyapps.io
        uses: qwert666/shinyapps-actions@main
        env:
          SHINY_USERNAME: 'dionnecargy'           # your ShinyApps.io username
          SHINY_TOKEN: ${{ secrets.TOKEN }}       # shinyapps.io token
          SHINY_SECRET: ${{ secrets.SECRET }}     # shinyapps.io secret
          APP_NAME: 'PvSeroApp'                   # the name for your app URL
          APP_DIR: ''                             # leave empty if app.R is in repo root
